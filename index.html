<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>javascript</title>
	<style type="text/css">
		button{
			background-color: skyblue;
			color: white;
			
		}
		input{
			background-color: skyblue;
			color: white;
			height: 30px;
		}

	</style>
</head>
<body><center>
	<button  onclick="myname()">click here</button>
	<p id="demo"></p>
	<div>
	<input type="text" id="input">
	<button onclick="showme()">show me</button>
	</div>
	<!-- <br>
	<div>
	<input type="text" id="demo" onmouseover="fname()"></div> -->
	
	<script type="text/javascript">
		function myname(){
			document.getElementById("demo").innerHTML="purnima mondal";
		}
		function showme(){
			let i = document.getElementById("input").value;
			alert(i);
		}
		// function fname(){
		// 	document.getElementById.innerHTML="fill in the box";
		// }
	</script>
    </center>
</body>
</html>
